      <animate attributeName="cy" values="300;250;300" dur="20s" repeatCount="indefinite"/>
      <animate attributeName="r" values="120;140;120" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1620" cy="300" r="120">
      <animate attributeName="cx" values="1620;1520;1620" dur="22s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="300;350;300" dur="22s" repeatCount="indefinite"/>
      <animate attributeName="r" values="120;100;120" dur="9s" repeatCount="indefinite"/>
