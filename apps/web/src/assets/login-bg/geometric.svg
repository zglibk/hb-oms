      <animate attributeName="y2" values="500;420;500" dur="14s" repeatCount="indefinite"/>
    </line>
    <line x1="100" y1="980" x2="500" y2="580">
      <animate attributeName="x1" values="100;200;100" dur="13s" repeatCount="indefinite"/>
      <animate attributeName="y1" values="980;900;980" dur="13s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="500;600;500" dur="13s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="580;660;580" dur="13s" repeatCount="indefinite"/>
    </line>
    <line x1="1820" y1="980" x2="1420" y2="580">
