<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#2d5a87"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#bgGrad)"/>
  <g stroke="#d4af37" stroke-width="1.5" fill="none" opacity="0.6">
    <polygon points="960,200 1200,400 1100,700 820,700 720,400">
      <animateTransform attributeName="transform" type="rotate" from="0 960 450" to="360 960 450" dur="60s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="960,300 1120,450 1050,650 870,650 800,450">
      <animateTransform attributeName="transform" type="rotate" from="360 960 475" to="0 960 475" dur="45s" repeatCount="indefinite"/>
